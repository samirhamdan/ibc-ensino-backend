name: xr-educacao

# VPS com ~2 GB de RAM compartilhada com outros sistemas: só o app roda aqui.
# Banco: database/usuário próprios dentro do alessio_postgres (rede lite_default).
# Caddy (alessio_caddy, mesma rede) faz proxy direto para xr_educacao_app:8000.
services:
  app:
    build: ../..
    container_name: xr_educacao_app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://xr:${XR_DB_PASSWORD}@alessio_postgres:5432/xr
      UPLOAD_FOLDER: /data/uploads
      GUNICORN_WORKERS: "1"
    volumes:
      - uploads:/data/uploads
    networks: [lite_default]
    mem_limit: 300m

volumes:
  uploads:

networks:
  lite_default:
    external: true
